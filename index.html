<script>
const TABS=['Resumen','Clasificación','Resultados','Estadísticas','Goleadores','Calendario'];
let M=[],TAB=0,J=1,CM=null,A={},AL=0;
const nm=s=>s.replace(/,/g,'').replace(/\s+/g,' ').trim(),me=n=>/RIUDOMS/.test(n),S=a=>a.reduce((s,x)=>s+x,0);

const bar=(v,mx,c)=>`<div class=bar><i class=${c} style="width:${mx?v/mx*100:0}%"></i></div>`;
function parse(d){M=Object.values(d.partidos).flat().map(m=>({j:+m.JORNADA,h:nm(m.NOMBRE_CASA),a:nm(m.NOMBRE_FUERA),gh:+m.GOLES_CASA,ga:+m.GOLES_FUERA,pl:m.ESTADO==='1'&&m.GOLES_CASA!=null&&m.GOLES_CASA!=='',t:m.COMIENZO1,f:m.FECHA_JORNADA,c:m.CAMPO,lat:m.LATITUD,lon:m.LONGITUD,ret:!!(m.RETIRADO_CASA||m.RETIRADO_FUERA)})).map(m=>{const[d,o,y]=m.f.split('/'),jd=new Date(+y,o-1,+d),dt=m.t?new Date(m.t):jd;return{...m,dt,post:!!m.t&&Math.abs(dt-jd)>4*864e5}});
 J=Math.max(1,...M.filter(m=>m.pl).map(m=>m.j))}
function table(){const T={};M.forEach(m=>[m.h,m.a].forEach(n=>T[n]??={n,pj:0,g:0,e:0,p:0,gf:0,gc:0}));

 return Object.values(T).map(t=>({...t,dg:t.gf-t.gc,pts:t.g*3+t.e})).sort((a,b)=>b.pts-a.pts||b.dg-a.dg||b.gf-a.gf)}
function mine(){return M.filter(m=>me(m.h)||me(m.a)).map(m=>{const home=me(m.h),gf=home?m.gh:m.ga,gc=home?m.ga:m.gh;return{...m,home,rv:home?m.a:m.h,loc:home?'Casa':'Fuera',gf,gc,r:!m.pl?'':gf>gc?'G':gf<gc?'P':'E'}}).sort((a,b)=>a.dt-b.dt||a.j-b.j)}
const nextM=my=>{const t=new Date();t.setHours(0,0,0,0);return my.find(x=>!x.pl&&!x.ret&&x.dt>=t)},hh=x=>x.t?x.dt.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}):'?',dias=x=>{const t=new Date();t.setHours(0,0,0,0);const n=Math.round((x.dt-t)/864e5);return n<=0?'¡hoy!':n==1?'mañana':'en '+n+' días'};
const mrow=x=>`<div class=row><span class="chip ${x.r}">${x.r}</span><span class=t>J${x.j} · ${x.loc} · ${x.rv}</span><b>${x.gf} - ${x.gc}</b></div>`;
function vResumen(){const T=table(),pos=T.findIndex(t=>me(t.n))+1,t=T[pos-1]||{},my=mine(),pl=my.filter(x=>x.pl),nx=nextM(my),nn=my.filter(x=>!x.pl&&!x.ret&&x.dt>(nx?nx.dt:0)).slice(0,2);
 return `<div class=kpis>${[[pos+'º','Posición'],[t.pts,'Puntos'],[t.pj,'Jugados'],[t.gf,'Goles a favor'],[t.gc,'Goles en contra'],[(t.dg>0?'+':'')+t.dg,'Diferencia']].map(([a,b])=>`<div class=kpi><b>${a}</b><span>${b}</span></div>`).join('')}</div>
<div class=card><h2>⚽ Próximo partido</h2>${nx?`<b>${nx.home?'Riudoms':nx.rv} vs ${nx.home?nx.rv:'Riudoms'}</b> (J${nx.j})${nx.post?'<span class=tag>APLAZADO</span>':''}<br>${when(nx)} · <b>${dias(nx)}</b><br>${nx.c}<br><div class=wx data-j="${nx.j}"></div><a href="https://www.google.com/maps?q=${nx.lat},${nx.lon}" target=_blank>📍 Cómo llegar</a>${nn.length?'<hr>Después:'+nn.map(x=>`<br>${when(x)} · ${x.loc} · ${x.rv}`).join(''):''}`:'No hay más partidos programados'}</div>
<div class=card><h2>Racha</h2>${pl.slice(-6).map(x=>`<span class="chip ${x.r}">${x.r}</span>`).join('')||'—'}</div>
<div class=card><h2>Últimos resultados</h2>${pl.slice().reverse().map(mrow).join('')||'—'}</div>`}
function vClas(){return `<div class=card style="overflow-x:auto"><table><tr><th>#<th>Equipo<th>PJ<th>G<th>E<th>P<th>GF<th>GC<th>DG<th>Pts</tr>${table().map((t,i)=>`<tr class="${me(t.n)?'me':''}"><td>${i+1}<td>${t.n}<td>${t.pj}<td>${t.g}<td>${t.e}<td>${t.p}<td>${t.gf}<td>${t.gc}<td>${t.dg}<td><b>${t.pts}</b></tr>`).join('')}</table></div>`}
function vRes(){const js=[...new Set(M.map(m=>m.j))].sort((a,b)=>a-b);
 return `<select onchange="J=+this.value;render()">${js.map(j=>`<option value=${j} ${j==J?'selected':''}>Jornada ${j}</option>`).join('')}</select><div class=card style="margin-top:10px">${M.filter(m=>m.j==J).map(m=>`<div class="row ${me(m.h)||me(m.a)?'mine':''}"><span class=t>${m.h}</span>${m.pl?`<b>${m.gh} - ${m.ga}</b>`:`<small>${m.ret?'Retirado':when(m)}</small>`}<span class="t r">${m.a}</span></div>`).join('')}</div>`}
function vStats(){const my=mine(),pl=my.filter(x=>x.pl),T=table(),n=pl.length;if(!n)return'<div class=card>Aún no hay partidos jugados</div>';
 const gf=S(pl.map(x=>x.gf)),gc=S(pl.map(x=>x.gc)),w=pl.filter(x=>x.r=='G').length,pts=S(pl.map(x=>x.r=='G'?3:x.r=='E'?1:0)),tot=my.filter(x=>!x.ret).length,mx=Math.max(...pl.map(x=>Math.max(x.gf,x.gc))),lg=S(T.map(t=>t.gf))/S(T.map(t=>t.pj));
 const K=[[f1(gf/n),'Goles marcados/partido'],[f1(gc/n),'Goles recibidos/partido'],[f1(pts/n),'Puntos/partido'],[Math.round(w/n*100)+'%','Victorias'],[pl.filter(x=>x.gc==0).length,'Porterías a cero'],[pl.filter(x=>x.gf>=5).length,'Partidos con 5+ goles'],[Math.round(pts/n*tot),`Proyección pts (${tot} part.)`],[f1(lg),'Media liga (gol/equipo/part.)']];
 const loc=l=>{const a=pl.filter(x=>x.loc==l),g=a.filter(x=>x.r=='G').length,e=a.filter(x=>x.r=='E').length;return `<tr><td>${l}<td>${a.length}<td>${g}<td>${e}<td>${a.length-g-e}<td>${S(a.map(x=>x.gf))}<td>${S(a.map(x=>x.gc))}</tr>`};
 const big=[...pl].sort((a,b)=>(b.gf-b.gc)-(a.gf-a.gc)),hi=[...pl].sort((a,b)=>(b.gf+b.gc)-(a.gf+a.gc));
 const rk=(f,asc)=>{const a=T.filter(t=>t.pj).map(t=>({n:t.n,v:f(t)})).sort((x,y)=>asc?x.v-y.v:y.v-x.v),m=Math.max(...a.map(x=>x.v),1);return a.map(x=>`<div class=row><span class=t style="${me(x.n)?'font-weight:700':''}">${x.n}</span><div style="flex:1">${bar(x.v,m,me(x.n)?'y':'f')}</div><b>${f1(x.v)}</b></div>`).join('')};
 return `<div class=kpis>${K.map(([a,b])=>`<div class=kpi><b>${a}</b><span>${b}</span></div>`).join('')}</div>
<div class=card><h2>Goles por partido <small>(verde a favor · rojo en contra)</small></h2>${pl.map(x=>`<div class=row><span style="width:105px;font-size:12px">J${x.j} ${x.rv.slice(0,12)}</span><div style="flex:1">${bar(x.gf,mx,'f')}<div style="height:3px"></div>${bar(x.gc,mx,'c')}</div><b>${x.gf}-${x.gc}</b></div>`).join('')}</div>
<div class=card><h2>Casa vs fuera</h2><table><tr><th><th>Loc.<th>PJ<th>G<th>E<th>P<th>GF<th>GC</tr>${loc('Casa')}${loc('Fuera')}</table></div>
<div class=card><h2>Récords</h2>Mayor victoria: <b>${big[0].rv} ${big[0].gf}-${big[0].gc}</b><br>Mayor derrota: <b>${big.at(-1).gf<big.at(-1).gc?big.at(-1).rv+' '+big.at(-1).gf+'-'+big.at(-1).gc:'—'}</b><br>Partido con más goles: <b>${hi[0].rv} (${hi[0].gf+hi[0].gc})</b></div>
<div class=card><h2>Ataque de la liga (goles/partido)</h2>${rk(t=>t.gf/t.pj)}</div>
<div class=card><h2>Defensa de la liga (goles recibidos/partido, menos es mejor)</h2>${rk(t=>t.gc/t.pj,true)}</div>`}
const cap=s=>s.toLowerCase().replace(/(^|[\s-])\S/g,c=>c.toUpperCase());
const FULLNAMES=false; // true = nombre y apellidos completos; false = "Nombre A."
const pn=s=>{let f,l;if(s.includes(',')){[l,f]=s.split(',').map(x=>x.trim())}else{[f,...l]=s.split(' ');l=l.join(' ')}return FULLNAMES?cap(f+' '+l):cap(f)+(l?' '+l[0].toUpperCase()+'.':'')};
const TR=[[1,15,"1' - 15'"],[16,30,"16' - 30'"],[31,45,"31' - 45'"],[46,60,"46' - 60'"],[61,99,"61'+"]];
function vGol(){const all=mine().filter(x=>x.pl),my=all.filter(x=>A[x.j]),er=A._err?Object.entries(A._err).map(([j,e])=>'J'+j+': '+e).join(' · '):'',warn=my.length<all.length?`<div class=card style="background:#ffe4e1"><b>⚠ Solo hay ${my.length} de ${all.length} actas.</b><br>Faltan por añadir las actas del resto de partidos.</div>`:'';if(!my.length)return'<div class=card>Aún no hay actas cargadas</div>';
 const G=[],pj={};
 my.forEach(x=>{const a=A[x.j],tm=Object.keys(a.lu).find(k=>me(k));(a.lu[tm]||[]).forEach(p=>{const n=pn(p.n);pj[n]=(pj[n]||0)+1});
  a.goals.forEach((g,i)=>{const us=(g.t==='h')===x.home;G.push({j:x.j,i,min:Math.max(1,g.min),us,k:g.k,n:g.k==='O'?null:pn(g.n)})})});
 const us=G.filter(g=>g.us),th=G.filter(g=>!g.us),sc={};
 us.filter(g=>g.k!=='O').forEach(g=>{const o=sc[g.n]??={g:0,m:{}};o.g++;o.m[g.j]=(o.m[g.j]||0)+1});
 const rows=[...new Set([...Object.keys(pj),...Object.keys(sc)])].map(n=>{const m=Object.values(sc[n]?.m||{});return{n,pj:pj[n]||0,g:sc[n]?.g||0,dbl:m.filter(v=>v==2).length,hat:m.filter(v=>v>=3).length}}).sort((a,b)=>b.g-a.g||b.pj-a.pj);
 const tc=g=>TR.findIndex(([a,b])=>g.min>=a&&g.min<=b),F=TR.map(()=>0),C=TR.map(()=>0);
 us.forEach(g=>F[tc(g)]++);th.forEach(g=>C[tc(g)]++);
 const last=F[4]+C[4]?5:4,idx=[...Array(last).keys()],pick=(a,f)=>idx.reduce((b,i)=>f(a[i],a[b])?i:b,0);
 const bf=pick(F,(x,y)=>x>y),wf=pick(F,(x,y)=>x<y),bc=pick(C,(x,y)=>x>y);
 const first=my.filter(x=>{const g=G.find(z=>z.j==x.j&&z.i==0);return g&&g.us}).length;
 const mx=Math.max(...F.slice(0,last),...C.slice(0,last),1),top=rows[0],mn=us.length?Math.round(S(us.map(g=>g.min))/us.length):0;
 const K=[[top.n+' ('+top.g+')','Máximo goleador'],[rows.filter(r=>r.g).length,'Jugadores que han marcado'],[TR[bf][2],'Tramo donde más marcamos'],[TR[wf][2],'Tramo donde menos marcamos'],[TR[bc][2],'Tramo donde más recibimos'],[first+'/'+my.length,'Marcamos primero'],["min "+mn,'Minuto medio de nuestros goles'],[us.filter(g=>g.k==='P').length,'Goles de penalti']];
 return warn+`<div class=kpis>${K.map(([a,b])=>`<div class=kpi><b style="font-size:${String(a).length>9?16:24}px">${a}</b><span>${b}</span></div>`).join('')}</div>
<div class=card><h2>Goles por tramo de partido <small>(verde a favor · rojo en contra)</small></h2>${idx.map(i=>`<div class=row><span style="width:80px;font-size:12px">${TR[i][2]}</span><div style="flex:1">${bar(F[i],mx,'f')}<div style="height:3px"></div>${bar(C[i],mx,'c')}</div><b>${F[i]} - ${C[i]}</b></div>`).join('')}</div>
<div class=card style="overflow-x:auto"><h2>Goleadores</h2><table><tr><th>#<th>Jugador<th>Goles<th>PJ<th>G/PJ<th>Dobletes<th>Hat-trick</tr>${rows.map((r,i)=>`<tr><td>${i==0&&r.g?'🥇':i+1}<td>${r.n}<td><b>${r.g}</b><td>${r.pj}<td>${r.pj?f1(r.g/r.pj):'-'}<td>${r.dbl||'-'}<td>${r.hat||'-'}</tr>`).join('')}</table>
<small>PJ = jugadores que figuran en el acta (titulares y suplentes). Datos de ${my.length} de ${all.length} partidos jugados.</small></div>`}
function vCal(){const my=mine(),nx=nextM(my);if(CM==null){const b=nx?nx.dt:new Date();CM=b.getFullYear()*12+b.getMonth()}
 const y=Math.floor(CM/12),mo=CM%12,off=(new Date(y,mo,1).getDay()+6)%7,nd=new Date(y,mo+1,0).getDate(),inM=my.filter(x=>x.dt.getFullYear()==y&&x.dt.getMonth()==mo);

 for(let d=1;d<=nd;d++){const x=inM.find(z=>z.dt.getDate()==d);c+=`<div class="day ${x?x.ret?'ret':x.pl?x.r:'next':''} ${x&&x===nx?'nx':''}"><b>${d}</b>${x?`<span>${x.home?'C':'F'} ${x.pl?x.gf+'-'+x.gc:x.ret?'—':hh(x)}</span><em>${x.rv.slice(0,9)}</em>`:''}</div>`}
 const up=my.filter(x=>!x.pl&&!x.ret&&x.dt>=new Date(new Date().setHours(0,0,0,0)));
 const lst=a=>a.map(x=>`<div class=row><span class="chip ${x.r||'E'}" style="${x.r?'':'background:#999'}">J${x.j}</span><span class=t><b>${x.dt.toLocaleDateString('es',{weekday:'short',day:'numeric',month:'short'})}</b> · ${x.loc} · ${x.rv}${x.post?'<span class=tag>APLAZADO</span>':''}<br><small style="text-align:left;padding:0">${x.ret?'Equipo retirado':x.pl?'':hh(x)+'h · '+x.c}</small>${x.pl||x.ret?'':'<span class="wx" data-j="'+x.j+'" style="display:block;font-size:12px"></span>'}</span>${x.pl?`<b>${x.gf} - ${x.gc}</b>`:`<a href="https://www.google.com/maps?q=${x.lat},${x.lon}" target=_blank>📍</a>`}</div>`).join('')||'—';
 return `<div class=card><div class=mh><button onclick="CM--;render()">‹</button><h2 style="margin:0;text-transform:capitalize">${new Date(y,mo,1).toLocaleDateString('es',{month:'long',year:'numeric'})}</h2><button onclick="CM++;render()">›</button></div>
<div class=cal>${'LMXJVSD'.split('').map(d=>`<div class=hd>${d}</div>`).join('')}${c}</div>
<small style="display:block;margin-top:8px">C = casa · F = fuera · <span class=chip style="background:var(--y);color:#000">próximo</span><span class="chip G">victoria</span><span class="chip E">empate</span><span class="chip P">derrota</span></small></div>
<div class=card><h2>Este mes</h2>${lst(inM)}</div><div class=card><h2>Próximos partidos</h2>${lst(up)}</div>`}
const WC=c=>c==0?'☀️':c<=2?'🌤️':c==3?'☁️':c<=48?'🌫️':c<=57?'🌦️':c<=67?'🌧️':c<=77?'🌨️':c<=82?'🌧️':c<=86?'🌨️':'⛈️',WXP={};
function loadWx(){const my=mine();document.querySelectorAll('.wx').forEach(async e=>{const x=my.find(z=>z.j==e.dataset.j);if(!x||!x.t||!x.lat)return;const n=(x.dt-new Date())/864e5;if(n<-.5||n>7)return;
 const d=x.t.slice(0,10),k=x.lat+','+x.lon+d;WXP[k]??=fetch(`https://api.open-meteo.com/v1/forecast?latitude=${x.lat}&longitude=${x.lon}&hourly=temperature_2m,precipitation_probability,wind_speed_10m,weather_code&timezone=Europe%2FMadrid&start_date=${d}&end_date=${d}`).then(r=>r.json());
 try{const j=(await WXP[k]).hourly,i=+x.t.slice(11,13);e.innerHTML=`${WC(j.weather_code[i])} ${Math.round(j.temperature_2m[i])}°C · 💧 ${j.precipitation_probability[i]??'-'}% lluvia · 💨 ${Math.round(j.wind_speed_10m[i])} km/h`}catch{}})}
